spring.application.name=${APPLICATION_NAME:Tournament Platform}
server.port=${SERVER_PORT:8080}

# Machine-specific settings (MySQL credentials, demo data) are read from a git-ignored file next to pom.xml.
# Copy application-local.properties.example to application-local.properties and fill it in.
spring.config.import=optional:file:./application-local.properties

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:tournament_platform}?createDatabaseIfNotExist=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Local development default. Production overrides this with application-prod.properties.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
# SQL logging is off by default because bind-value logging would print data such as password hashes.
spring.jpa.show-sql=${SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true
spring.mvc.throw-exception-if-no-handler-found=true
spring.web.resources.add-mappings=false

# Initial ADMINISTRATOR account, created once on startup if no administrator exists yet.
# Leave blank (the default) to skip bootstrap - see AdminAccountInitializer.
app.admin.username=${ADMIN_USERNAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# Demo accounts and tournaments for presentations - created once, and only into an empty database.
# Never enable in production: the demo accounts share a published password. See DemoDataInitializer.
app.demo-data=${DEMO_DATA:false}
